<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNJhost - Commander un hébergement</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>PNJHOST</h1>
        <nav>
            <ul>
                <li><a href="index.html"><i class="fas fa-home"></i> Accueil</a></li>
                <li><a href="retours.html"><i class="fas fa-comment-alt"></i> Retours</a></li>
                <li><a href="achatserveurs.html"><i class="fas fa-server"></i> Achat de serveurs</a></li>
                <li><a href="aide.html"><i class="fas fa-question-circle"></i> Aide</a></li>
                <li><a href="panier.html"><i class="fas fa-shopping-cart"></i> Mon Panier</a></li>
                <li><a href="compte.html"><i class="fas fa-user"></i> Mon compte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h2>Commander votre hébergement</h2>
            <p>Choisissez un plan, indiquez votre domaine et confirmez votre commande en quelques secondes.</p>
        </section>

        <div class="card">
            <form class="form-card">
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="plan">Plan d'hébergement</label>
                    <select id="plan" name="plan">
                        <option value="basic">Basic</option>
                        <option value="pro">Pro</option>
                        <option value="enterprise">Enterprise</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="domaine">Nom de domaine</label>
                    <input type="text" id="domaine" name="domaine">
                </div>
                <button type="submit" class="btn">Commander</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 PNJhost. Tous droits réservés.</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNJhost - Hébergement Web</title>
    <style>
           body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f4f4f4;
    }

    /* Header */
    header {
        background-color: #05d5fa;
        color: #ffffff;
        padding: 1rem;
        text-align: center;
    }

    header h1 {
        margin-bottom: 1rem;
    }

    nav ul {
        list-style-type: none;
    }

    nav ul li {
        display: inline;
        margin-right: 1rem;
    }

    nav ul li a {
        color: #ffffff;
        text-decoration: none;
        transition: color 0.3s ease;
    }

    nav ul li a:hover {
        color: #e8491d;
    }

    /* Main content */
    main {
        width: 80%;
        margin: 2rem auto;
        background-color: #ffffff;
        padding: 2rem;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    h2 {
        color: #35424a;
        margin-bottom: 1rem;
    }

    /* Form */
    form {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    label {
        margin-top: 1rem;
    }

    input, textarea {
        padding: 0.5rem;
        margin-top: 0.5rem;
        border: 1px solid #ddd;
        border-radius: 3px;
        width: 100%;
        max-width: 300px;
    }

    textarea {
        height: 150px;
    }

    button {
        background-color: #e8491d;
        color: #ffffff;
        padding: 0.7rem 1.5rem;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        margin-top: 1rem;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #c13a1b;
    }

    /* Footer */
    footer {
        background-color: #35424a;
        color: #ffffff;
        text-align: center;
        padding: 1rem;
        position: fixed;
        bottom: 0;
        width: 100%;
    }
    </style>
</head>
<body>
    <header>
        <h1>PNJhost</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="retours.html">Retours</a></li>
                <li><a href="achatserveurs.html">Achat de serveurs</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Contactez-nous</h2>
        <form action="#" method="post">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>
    
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required>
    
            <label for="message">Message :</label>
            <textarea id="message" name="message" required></textarea>
    
            <button type="submit">Envoyer</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2024 PNJhost. Tous droits réservés.</p>
    </footer>
</body>
</html>
